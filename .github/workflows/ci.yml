name: OpenEats CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up sample testing data directory
        run: |
          mv backend/sample-data backend/data

      - name: Configure JWT signing key
        run: |
          cp .env.example .env
          SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          sed -i '/^JWT_SECRET_KEY=/d' .env
          echo "JWT_SECRET_KEY=$SECRET" >> .env

      - name: Run automated pytests
        run: |
          python -m pytest backend/tests -q -s --tb=short